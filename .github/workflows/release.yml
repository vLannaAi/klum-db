name: Release to npm

# Strict release pipeline for the @klum-db/lobby standalone package.
#
# Triggered on GitHub Release `published`. Runs the full verification
# gate (install + build + lint + typecheck + test) plus the peer-floor
# gate (the declared peer ranges must actually compile) on a clean
# checkout at the release tag, and only publishes if every gate passes.
#
# Publishes with `--provenance` so the npm registry attests a
# verifiable cryptographic link between the tarball and this workflow
# run (supply-chain integrity). Requires `id-token: write` permission
# on the job.
#
# ── npm dist-tag routing ─────────────────────────────────────────────
#
#   • `latest` — the default install (`pnpm add @klum-db/lobby`). Used
#     for stable themed releases.
#   • `next`   — opt-in early-adopter channel (`pnpm add @klum-db/lobby@next`).
#
# Routing rules:
#   - `release` event with `prerelease: true` (the "Set as a pre-release"
#     checkbox on the GitHub Release form) → publishes with `--tag next`.
#   - `release` event with `prerelease: false` → publishes with `--tag latest`.
#   - Manual `workflow_dispatch` → uses the `tag` input (default `latest`).
#
# Both paths preserve `--provenance` and the strict verification gate.
# The chosen tag is echoed to the workflow log + the run summary before
# any publish runs, so an unintended target shows up immediately.
#
# Setup required (one-time, in repo Settings → Secrets and variables):
#   - NPM_TOKEN (npm automation token with publish access to @klum-db/*)
#   - GitHub Actions must have "Read and write permissions" under
#     Settings → Actions → General → Workflow permissions
#
# Manual dispatch is available for first-publish or re-publish debugging;
# it requires typing PUBLISH into the confirm field so accidental triggers
# can't publish by mistake. The `tag` input lets a maintainer override
# the dist-tag without touching this file.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm manual trigger'
        required: true
        default: ''
      tag:
        description: 'npm dist-tag (latest | next | canary | rc | beta | alpha)'
        required: false
        default: 'latest'
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml', '.github/workflows/peer-floor.yml']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Gate 1: strict verification ──────────────────────────────────────
  verify:
    name: Verify (strict)
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.confirm == 'PUBLISH' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify package.json version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "❌ @klum-db/lobby version ($PKG_VERSION) does not match release tag ($VERSION)"
            exit 1
          fi
          echo "✅ @klum-db/lobby@$PKG_VERSION matches release tag v$VERSION"

      # The dist-tag is routed entirely by the "Set as a pre-release" checkbox on
      # the Release form, so a forgotten tick publishes a pre-release to @latest.
      # That is not self-healing: it takes a manual `npm dist-tag` repair.
      #
      # This repo has already been bitten. @klum-db/lobby@latest is stuck at
      # 0.2.0-pre.26, whose peers demand @noy-db/hub ^0.2.0-pre.24 — so anyone
      # running `pnpm add @klum-db/lobby` untagged gets something that cannot
      # co-install with the current family. Refuse the mismatch rather than rely
      # on the checkbox. Ported from noy-db-ui#22.
      #
      # Only this direction is blocked: a STABLE version published to @next is
      # harmless and recoverable, so it stays allowed.
      - name: Refuse a semver pre-release routed to @latest
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if [ "${{ github.event.release.prerelease }}" != "true" ] && [ "${VERSION#*-}" != "$VERSION" ]; then
            echo "::error::$VERSION is a semver pre-release, but this Release is not marked as a pre-release."
            echo "::error::Publishing would route it to @latest — which is how @latest got stuck at 0.2.0-pre.26."
            echo "::error::Tick 'Set as a pre-release' on the Release and re-run."
            exit 1
          fi
          echo "✅ routing check passed (version=$VERSION, prerelease=${{ github.event.release.prerelease }})"

  # ── Gate 2: the peer ranges must be TRUE, not merely well-formed ─────
  #
  # Every step in `verify` above resolves @noy-db/* from the exact dev pin, so
  # none of them ever exercises the declared peer RANGES. A range can promise
  # versions the code cannot run on and all 394 tests stay green — which is
  # precisely what 0.4.0-pre.5 shipped: `^0.6.0-pre.0` while the code needs
  # hasNoydbPodMagic from 0.6.0-pre.14. scripts/check-peer-floor.mjs existed at
  # that point and would have caught it; it just never ran on the release path,
  # because peer-floor.yml is scoped to package.json edits and a Release event
  # is not one.
  #
  # Called as a reusable workflow rather than inlined so there is one config for
  # the guard. That matters here: peer-floor.yml deliberately runs with NO pnpm
  # store cache (a cache keyed on the lockfile can mask a floor that cannot even
  # be installed, and "cannot install" is itself a failed claim), while `verify`
  # above keeps one. Inlining would have quietly put the cache in front of it.
  peer-floor:
    name: Peer floor
    if: github.event_name == 'release' || github.event.inputs.confirm == 'PUBLISH' || github.event_name == 'push'
    uses: ./.github/workflows/peer-floor.yml
    with:
      ref: ${{ github.event.release.tag_name || github.ref }}

  # ── Gate 3: publish with provenance ──────────────────────────────────
  #
  # Explicit event guard: publish only runs on:
  #   - a `release` event (someone created a GitHub Release), or
  #   - a `workflow_dispatch` with `confirm: PUBLISH` typed in.
  #
  # The `verify` job above also runs on `push` to main when this file
  # changes (so workflow edits get tested), but the publish step
  # MUST NOT run on that path — otherwise pushing a workflow edit
  # could auto-publish to npm without explicit confirmation.
  publish:
    name: Publish to npm
    needs: [verify, peer-floor]
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'PUBLISH')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm --provenance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Resolve the npm dist-tag for this run. Computed once + echoed
      # to the run summary so an unintended target shows up before any
      # publish runs. Allowlist guards against typos in workflow_dispatch
      # input — the publish step refuses to run with an unknown tag.
      - name: Resolve npm dist-tag
        id: dist_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              TAG="next"
              REASON="release event, prerelease=true"
            else
              TAG="latest"
              REASON="release event, prerelease=false"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            REASON="workflow_dispatch tag input"
          else
            TAG="latest"
            REASON="default"
          fi

          case "$TAG" in
            latest|next|canary|rc|beta|alpha) ;;
            *)
              echo "❌ Refusing to publish: tag '$TAG' is not in the allowlist (latest|next|canary|rc|beta|alpha)."
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### npm dist-tag" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Reason:** $REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TAG" = "latest" ]; then
            echo "Consumers run \`pnpm add @klum-db/lobby\` (default install)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Consumers run \`pnpm add @klum-db/lobby@$TAG\` (opt-in channel)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Check which npm account the token belongs to. If this step fails,
      # the token is invalid; if it shows the wrong user, the user's account
      # doesn't own @klum-db/*.
      #
      # It is `continue-on-error` on purpose — a diagnostic must never be what
      # fails a release. But a non-fatal step that fails quietly is invisible:
      # the run still reports success and nobody opens the job. So the failure
      # branch is annotated AND written to the run summary, where it is legible
      # without drilling in.
      - name: Check npm auth (whoami)
        run: |
          if WHOAMI=$(npm whoami 2>&1); then
            echo "npm user: $WHOAMI"
            echo "- npm user: \`$WHOAMI\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::npm whoami failed: $WHOAMI"
            {
              echo "### ⚠️ npm auth check FAILED"
              echo ""
              echo '```'
              echo "$WHOAMI"
              echo '```'
              echo ""
              echo "npm reports write-path auth failures as \`404 Not Found\`, never \`401\` —"
              echo "so \"is not in this registry\" almost always means an expired or wrong-account"
              echo "NPM_TOKEN, not a naming problem. The publish step below will fail too."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      # Single-package publish. `--no-git-checks` because the publish job
      # checks out a tag, not a branch — pnpm's default branch-clean check
      # would fail otherwise. `--provenance` requires id-token: write
      # (granted on the job above). pnpm skips a version already on the
      # registry, so re-runs are safe.
      - name: Publish @klum-db/lobby
        run: |
          set -o pipefail
          echo "Publishing @klum-db/lobby with --tag ${{ steps.dist_tag.outputs.tag }}"
          pnpm publish \
            --access public \
            --tag '${{ steps.dist_tag.outputs.tag }}' \
            --no-git-checks \
            --provenance 2>&1 | tee /tmp/publish.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            echo "### Publish failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/publish.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$EXIT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarise
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`${{ github.event.release.tag_name || github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm dist-tag: \`${{ steps.dist_tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provenance: enabled (look for the ✓ on https://www.npmjs.com/package/@klum-db/lobby)" >> "$GITHUB_STEP_SUMMARY"
